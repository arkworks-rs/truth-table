[package]
name = "tt-zkvm-script"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "micro"
path = "src/bin/micro.rs"

[[bin]]
name = "tpch"
path = "src/bin/tpch.rs"

[dependencies]
sp1-sdk = { version = "6.10.0", features = ["blocking"] }
tt-zkvm-lib = { path = "../lib" }
arrow = "57"
parquet = "57"
bincode = "1.3"
csv = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
sp1-build = "6.10.0"

[features]
# The CUDA prover (SP1_PROVER=cuda).
cuda = ["sp1-sdk/cuda"]
